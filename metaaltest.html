<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metaaltest — glansvarianten</title>
<meta name="robots" content="noindex">
<style>
/* Zelfstandige testpagina. Raakt style.css en script.js niet aan en
   wordt nergens vanuit het spel gelinkt; puur om de gedreven-rand-knop
   tegen verschillende achtergronden en paneelranden te kunnen zien. */

@font-face {
    font-family: 'Cinzel';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("fonts/cinzel-700.woff2") format("woff2");
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 2rem 1.5rem 4rem;
    font-family: Georgia, 'Times New Roman', serif;
    background: #E9C182;
    transition: background 0.2s;
}

/* ---- de zes achtergronden ---- */

body.bg-zand        { background: #E9C182; }
body.bg-warmbruin   { background: #8C6239; }
body.bg-terracotta  { background: #6B3A2A; }
body.bg-donkerbruin { background: #3A2617; }
body.bg-diepnavy    { background: #0B1730; }
body.bg-zwart       { background: #14120F; }

/* ---- de twee schakelaarrijen ---------------------------------------------
   Eigen vaste vormgeving, los van de body-achtergrond: lichte chip met
   donkere tekst leest op alle zes de achtergronden. De actieve knop krijgt
   een dikke gouden rand. */

.bediening {
    max-width: 62rem;
    margin: 0 auto 1rem;
}

.bediening h3 {
    font-size: 0.8125rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #F0E8D8;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    margin: 0 0 0.5rem;
}

.rij {
    display: flex;
    flex-wrap: wrap;
    gap: 0.625rem;
    margin: 0 0 1.75rem;
}

.rij button {
    font-family: inherit;
    font-size: 0.9375rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: 3px solid transparent;
    background: #EFEBE2;
    color: #14120F;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.rij button.actief {
    border-color: #C8A03C;
    font-weight: bold;
}

/* Kleurstaal in de achtergrondknoppen, zodat je ziet wat je kiest. */
.staal {
    width: 0.875rem;
    height: 0.875rem;
    border-radius: 3px;
    border: 1px solid rgba(0, 0, 0, 0.35);
}

/* ---- het paneel ---- */

.paneel {
    background: #101C38;
    padding: 24px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 420px;
    margin: 0 auto;
    border: none;
    box-shadow: none;
}

.paneel.rand-goud  { border: 2px solid #C8A03C; }
.paneel.rand-gloed { box-shadow: 0 0 40px 8px rgba(200, 160, 60, 0.28); }

/* ---- de knoppen zelf ---- */

.knop {
    width: 100%;
    height: 60px;
    border-radius: 8px;
    font-size: 20px;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.02em;
    cursor: pointer;
    color: var(--tekst);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
}

/* ---- kleurrollen per metaal ---- */

.goud {
    --rimdonker:    #6B4A10;
    --spiegelwit:   #FFF3C4;
    --boventoon:    #F2CE55;
    --middentoon:   #C99A22;
    --kerndonker:   #8F6512;
    --weerkaatsing: #E8BC3E;
    --onderlicht:   #FFEBA8;
    --tekst:        #2A1B05;
}

.zilver {
    --rimdonker:    #5A5F6B;
    --spiegelwit:   #FFFFFF;
    --boventoon:    #E3E7EE;
    --middentoon:   #A8AEBA;
    --kerndonker:   #6E7480;
    --weerkaatsing: #D2D7E0;
    --onderlicht:   #F2F4F8;
    --tekst:        #1C2028;
}

.brons {
    --rimdonker:    #4A2C0E;
    --spiegelwit:   #F2C89A;
    --boventoon:    #C98A4E;
    --middentoon:   #96602C;
    --kerndonker:   #5E3A12;
    --weerkaatsing: #B87A3E;
    --onderlicht:   #E0A874;
    --tekst:        #2A1B05;
}

/* ---- C: gedreven rand ---------------------------------------------------
   Zacht verloop als basis; het metaal komt hier uit de rand en niet uit
   het vlak. De border telt door box-sizing: border-box niet op bij de
   hoogte, zodat alle drie de knoppen even groot blijven. */
.variant-c {
    background-image: linear-gradient(to bottom,
        var(--rimdonker)     0%,
        var(--spiegelwit)    10%,
        var(--boventoon)     23%,
        var(--middentoon)    37%,
        var(--kerndonker)    50%,
        var(--weerkaatsing)  63%,
        var(--onderlicht)    80%,
        var(--rimdonker)     93%,
        var(--rimdonker)     100%);
    box-shadow:
        inset 0  2px 0    rgba(255, 255, 255, 0.75),
        inset 0 -2px 0    rgba(0, 0, 0, 0.45),
        inset 0  8px 14px rgba(255, 255, 255, 0.18),
        inset 0 -8px 14px rgba(0, 0, 0, 0.30);
    border: 1px solid var(--rimdonker);
}
</style>
</head>
<body class="bg-zand">

<div class="bediening">

    <h3>Achtergrond</h3>
    <div class="rij" id="rij-achtergrond">
        <button type="button" class="actief" data-bg="bg-zand"><span class="staal" style="background:#E9C182"></span>Zand</button>
        <button type="button" data-bg="bg-warmbruin"><span class="staal" style="background:#8C6239"></span>Warm bruin</button>
        <button type="button" data-bg="bg-terracotta"><span class="staal" style="background:#6B3A2A"></span>Terracotta</button>
        <button type="button" data-bg="bg-donkerbruin"><span class="staal" style="background:#3A2617"></span>Donkerbruin</button>
        <button type="button" data-bg="bg-diepnavy"><span class="staal" style="background:#0B1730"></span>Diepnavy</button>
        <button type="button" data-bg="bg-zwart"><span class="staal" style="background:#14120F"></span>Bijna zwart</button>
    </div>

    <h3>Paneelrand</h3>
    <div class="rij" id="rij-paneel">
        <button type="button" class="actief" data-rand="">Geen rand</button>
        <button type="button" data-rand="rand-goud">Gouden rand</button>
        <button type="button" data-rand="rand-gloed">Gloed</button>
    </div>

</div>

<div class="paneel" id="paneel">
    <button type="button" class="knop variant-c brons">Beginner</button>
    <button type="button" class="knop variant-c zilver">Advanced</button>
    <button type="button" class="knop variant-c goud">Expert</button>
</div>

<script>
(function () {
    var ACHTERGRONDEN = ["bg-zand", "bg-warmbruin", "bg-terracotta",
                         "bg-donkerbruin", "bg-diepnavy", "bg-zwart"];
    var RANDEN = ["rand-goud", "rand-gloed"];
    var paneel = document.getElementById("paneel");

    function markeer(rij, knop) {
        rij.querySelectorAll("button").forEach(function (b) {
            b.classList.toggle("actief", b === knop);
        });
    }

    // De twee rijen werken los van elkaar: elke combinatie is te bekijken.
    document.getElementById("rij-achtergrond").addEventListener("click", function (e) {
        var knop = e.target.closest("button");
        if (!knop) return;
        ACHTERGRONDEN.forEach(function (c) { document.body.classList.remove(c); });
        document.body.classList.add(knop.dataset.bg);
        markeer(this, knop);
    });

    document.getElementById("rij-paneel").addEventListener("click", function (e) {
        var knop = e.target.closest("button");
        if (!knop) return;
        RANDEN.forEach(function (c) { paneel.classList.remove(c); });
        if (knop.dataset.rand) paneel.classList.add(knop.dataset.rand);
        markeer(this, knop);
    });
})();
</script>

</body>
</html>
