<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metaaltest — glansvarianten</title>
<meta name="robots" content="noindex">
<style>
/* Zelfstandige testpagina. Raakt style.css en script.js niet aan en
   wordt nergens vanuit het spel gelinkt; puur om drie glansbehandelingen
   van dezelfde metaalkleuren naast elkaar te kunnen zien. */

@font-face {
    font-family: 'Cinzel';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("fonts/cinzel-700.woff2") format("woff2");
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 2rem 1.5rem 4rem;
    font-family: Georgia, 'Times New Roman', serif;
    background: #0B1730;
    transition: background 0.2s;
}

body.zand { background: #E9C182; }

/* ---- knoppenrij voor de achtergrond ---- */

.schakelaars {
    display: flex;
    gap: 0.75rem;
    margin: 0 0 2rem;
}

.schakelaars button {
    font-family: inherit;
    font-size: 0.9375rem;
    padding: 0.5rem 1.25rem;
    border-radius: 6px;
    border: 1px solid #7d8aa5;
    background: #1b2c50;
    color: #e8e6df;
    cursor: pointer;
}

.schakelaars button.actief {
    background: #e8e6df;
    color: #0B1730;
    border-color: #e8e6df;
}

/* ---- drie kolommen ---- */

.kolommen {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    max-width: 72rem;
}

.kolom h2 {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 700;
    font-size: 1.0625rem;
    color: #e8e6df;
    margin: 0 0 0.75rem;
    letter-spacing: 0.02em;
}

body.zand .kolom h2 { color: #2A1B05; }

/* Diepnavy paneel, zodat de knoppen niet los op de body zweven. */
.paneel {
    background: #101C38;
    padding: 24px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

/* ---- de knoppen zelf ---- */

.knop {
    width: 100%;
    height: 60px;
    border-radius: 8px;
    font-size: 20px;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.02em;
    border: none;
    cursor: pointer;
    color: var(--tekst);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
}

/* ---- kleurrollen per metaal ---- */

.goud {
    --rimdonker:    #6B4A10;
    --spiegelwit:   #FFF3C4;
    --boventoon:    #F2CE55;
    --middentoon:   #C99A22;
    --kerndonker:   #8F6512;
    --weerkaatsing: #E8BC3E;
    --onderlicht:   #FFEBA8;
    --tekst:        #2A1B05;
}

.zilver {
    --rimdonker:    #5A5F6B;
    --spiegelwit:   #FFFFFF;
    --boventoon:    #E3E7EE;
    --middentoon:   #A8AEBA;
    --kerndonker:   #6E7480;
    --weerkaatsing: #D2D7E0;
    --onderlicht:   #F2F4F8;
    --tekst:        #1C2028;
}

.brons {
    --rimdonker:    #4A2C0E;
    --spiegelwit:   #F2C89A;
    --boventoon:    #C98A4E;
    --middentoon:   #96602C;
    --kerndonker:   #5E3A12;
    --weerkaatsing: #B87A3E;
    --onderlicht:   #E0A874;
    --tekst:        #2A1B05;
}

/* ---- A: harde spiegelband ----------------------------------------------
   Elke kleur krijgt twee stops op dezelfde positie, dus geen enkele
   overgang. Geen box-shadow en geen border: de glans komt volledig uit
   het verloop. */
.variant-a {
    background-image: linear-gradient(to bottom,
        var(--rimdonker)     0%,   var(--rimdonker)     10%,
        var(--spiegelwit)    10%,  var(--spiegelwit)    23%,
        var(--boventoon)     23%,  var(--boventoon)     37%,
        var(--middentoon)    37%,  var(--middentoon)    50%,
        var(--kerndonker)    50%,  var(--kerndonker)    63%,
        var(--weerkaatsing)  63%,  var(--weerkaatsing)  80%,
        var(--onderlicht)    80%,  var(--onderlicht)    93%,
        var(--rimdonker)     93%,  var(--rimdonker)     100%);
}

/* ---- B: gebogen licht ---------------------------------------------------
   Twee lagen. Bovenop een witte glans met een harde afsnijding op 42-44%,
   daaronder hetzelfde verloop als A maar met enkele stops, dus zacht.
   Samen leest dat als een bol oppervlak. */
.variant-b {
    background-image:
        linear-gradient(to bottom,
            rgba(255, 255, 255, 0.55) 0%,
            rgba(255, 255, 255, 0.10) 42%,
            rgba(255, 255, 255, 0)    44%,
            rgba(255, 255, 255, 0)    78%,
            rgba(255, 255, 255, 0.18) 100%),
        linear-gradient(to bottom,
            var(--rimdonker)     0%,
            var(--spiegelwit)    10%,
            var(--boventoon)     23%,
            var(--middentoon)    37%,
            var(--kerndonker)    50%,
            var(--weerkaatsing)  63%,
            var(--onderlicht)    80%,
            var(--rimdonker)     93%,
            var(--rimdonker)     100%);
}

/* ---- C: gedreven rand ---------------------------------------------------
   Zacht verloop als basis; het metaal komt hier uit de rand en niet uit
   het vlak. De border telt door box-sizing: border-box niet op bij de
   hoogte, zodat alle negen knoppen even groot blijven. */
.variant-c {
    background-image: linear-gradient(to bottom,
        var(--rimdonker)     0%,
        var(--spiegelwit)    10%,
        var(--boventoon)     23%,
        var(--middentoon)    37%,
        var(--kerndonker)    50%,
        var(--weerkaatsing)  63%,
        var(--onderlicht)    80%,
        var(--rimdonker)     93%,
        var(--rimdonker)     100%);
    box-shadow:
        inset 0  2px 0    rgba(255, 255, 255, 0.75),
        inset 0 -2px 0    rgba(0, 0, 0, 0.45),
        inset 0  8px 14px rgba(255, 255, 255, 0.18),
        inset 0 -8px 14px rgba(0, 0, 0, 0.30);
    border: 1px solid var(--rimdonker);
}
</style>
</head>
<body>

<div class="schakelaars">
    <button type="button" id="knop-navy" class="actief">Navy achtergrond</button>
    <button type="button" id="knop-zand">Zandkleurige achtergrond</button>
</div>

<div class="kolommen">

    <div class="kolom">
        <h2>A - harde spiegelband</h2>
        <div class="paneel">
            <button type="button" class="knop variant-a brons">Beginner</button>
            <button type="button" class="knop variant-a zilver">Advanced</button>
            <button type="button" class="knop variant-a goud">Expert</button>
        </div>
    </div>

    <div class="kolom">
        <h2>B - gebogen licht</h2>
        <div class="paneel">
            <button type="button" class="knop variant-b brons">Beginner</button>
            <button type="button" class="knop variant-b zilver">Advanced</button>
            <button type="button" class="knop variant-b goud">Expert</button>
        </div>
    </div>

    <div class="kolom">
        <h2>C - gedreven rand</h2>
        <div class="paneel">
            <button type="button" class="knop variant-c brons">Beginner</button>
            <button type="button" class="knop variant-c zilver">Advanced</button>
            <button type="button" class="knop variant-c goud">Expert</button>
        </div>
    </div>

</div>

<script>
(function () {
    var navy = document.getElementById('knop-navy');
    var zand = document.getElementById('knop-zand');

    function zet(isZand) {
        document.body.classList.toggle('zand', isZand);
        navy.classList.toggle('actief', !isZand);
        zand.classList.toggle('actief', isZand);
    }

    navy.addEventListener('click', function () { zet(false); });
    zand.addEventListener('click', function () { zet(true); });
})();
</script>

</body>
</html>
